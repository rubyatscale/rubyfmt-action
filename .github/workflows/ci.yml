name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."

      - name: Download actionlint
        run: bash <(curl --fail --silent --show-error --location "https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash")
        shell: bash

      - name: actionlint
        run: ./actionlint -color
        shell: bash

  test-formatted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run rubyfmt-action against a formatted fixture (expect success)
        uses: ./
        with:
          paths: test/fixtures/formatted.rb

  test-unformatted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run rubyfmt-action against an unformatted fixture (expect failure)
        id: rubyfmt
        continue-on-error: true
        uses: ./
        with:
          paths: test/fixtures/unformatted.rb

      - name: Assert the action failed
        if: steps.rubyfmt.outcome != 'failure'
        run: |
          echo "::error::Expected rubyfmt-action to fail on an unformatted fixture, but it reported '${{ steps.rubyfmt.outcome }}'"
          exit 1

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run rubyfmt-action against a formatted fixture (expect success)
        uses: ./
        with:
          paths: test/fixtures/formatted.rb
